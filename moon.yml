tags: [go-lint]
toolchains:
  default: system
fileGroups:
  sources:
    - mise.toml
    - mise.lock
    - go.mod
    - go.sum
    - ./**/*.go
    - internal/**/*.gotmpl
tasks:
  update-goldens:
    description: Refresh the intentionally tracked output snapshots used by generator contract tests.
    script: |
      set -euo pipefail
      go run ./cmd/oasmith --openapi testdata/fixtures/config.yaml --mode types --lang go --out testdata/golden/config-go
      go run ./cmd/oasmith --openapi testdata/fixtures/worker.yaml --mode types --lang go --out testdata/golden/worker-go
      go run ./cmd/oasmith --openapi testdata/fixtures/public-client.yaml --mode client --lang go --out testdata/golden/public-client-go
      go run ./cmd/oasmith --openapi testdata/fixtures/private.yaml --mode client --lang typescript --out testdata/golden/private-typescript
      go run ./cmd/oasmith --openapi testdata/fixtures/config.yaml --mode client --lang typescript --out testdata/golden/config-typescript
      go run ./cmd/oasmith --openapi testdata/fixtures/binary-response.yaml --mode client --lang go --out testdata/golden/binary-response-go
      go run ./cmd/oasmith --openapi testdata/fixtures/binary-response.yaml --mode client --lang typescript --out testdata/golden/binary-response-typescript
    options:
      cache: false
      runInCI: false
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - ~:mod-download
    inputs:
      - ./**/*.go
      - internal/**/*.gotmpl
      - testdata/**/*
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go test -count=1 -timeout=30s ./...
    options:
      cache: true
  lint:
    deps:
      - ~:mod-download
    inputs:
      - ./**/*.go
      - .golangci.yaml
      - internal/**/*.gotmpl
      - go.mod
      - go.sum
    options:
      cache: true
  check:
    deps:
      - ~:lint
      - ~:test
    inputs: []
    options:
      runInCI: false
