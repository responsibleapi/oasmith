toolchains:
  default: system
tasks:
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - oasmith:mod-download
    inputs:
      - ./**/*.go
      - internal/**/*.gotmpl
      - internal/**/*.json
      - testdata/**/*
      - go.mod
      - go.sum
      - .node-version
    script: |-
      set -euo pipefail
      go test -count=1 ./...
    options:
      cache: true
  lint:
    deps:
      - oasmith:mod-download
    inputs:
      - ./**/*.go
      - .golangci.yaml
      - internal/**/*.gotmpl
      - internal/**/*.json
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      if [[ "${CI:-}" == "true" ]]; then
        test -z "$(gofmt -l .)"
      else
        gofmt -w .
      fi
      go vet ./...
      mkdir -p .cache/golangci-lint-tmp
      GOLANGCI_LINT_CACHE="${GOLANGCI_LINT_CACHE:-$PWD/.cache/golangci-lint}" \
        TMPDIR="$PWD/.cache/golangci-lint-tmp" go tool golangci-lint run ./...
    options:
      cache: true
  check:
    deps:
      - oasmith:lint
      - oasmith:test
