toolchains:
  default: system
fileGroups:
  sources:
    - go.mod
    - go.sum
    - ./**/*.go
    - internal/**/*.gotmpl
tasks:
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - ~:mod-download
    inputs:
      - ./**/*.go
      - internal/**/*.gotmpl
      - testdata/**/*
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go test -count=1 ./...
    options:
      cache: true
  lint:
    deps:
      - ~:mod-download
    inputs:
      - ./**/*.go
      - .golangci.yaml
      - internal/**/*.gotmpl
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      if [[ "${CI:-}" == "true" ]]; then
        test -z "$(gofmt -l .)"
      else
        gofmt -w .
      fi
      go vet ./...
      mkdir -p .cache/golangci-lint-tmp
      GOLANGCI_LINT_CACHE="${GOLANGCI_LINT_CACHE:-$PWD/.cache/golangci-lint}" \
        TMPDIR="$PWD/.cache/golangci-lint-tmp" go tool golangci-lint run ./...
    options:
      cache: true
  check:
    deps:
      - ~:lint
      - ~:test
    inputs: []
    options:
      runInCI: false
