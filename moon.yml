toolchains:
  default: system
fileGroups:
  sources:
    - go.mod
    - go.sum
    - ./**/*.go
    - internal/**/*.gotmpl
tasks:
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - ~:mod-download
    inputs:
      - ./**/*.go
      - internal/**/*.gotmpl
      - testdata/**/*
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go test -count=1 ./...
    options:
      cache: true
  lint:
    deps:
      - ~:mod-download
    inputs:
      - ./**/*.go
      - .golangci.yaml
      - internal/**/*.gotmpl
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      if [[ "${CI:-}" == "true" ]]; then
        test -z "$(gofmt -l .)"
      else
        gofmt -w .
      fi
      go vet ./...
      mkdir -p .cache/golangci-lint-tmp
      GOLANGCI_LINT_CACHE="${GOLANGCI_LINT_CACHE:-$PWD/.cache/golangci-lint}" \
        TMPDIR="$PWD/.cache/golangci-lint-tmp" go tool golangci-lint run ./...
    options:
      cache: true
  check:
    deps:
      - ~:lint
      - ~:test
      - ~:test-rust
    inputs: []
    options:
      runInCI: false
  generate-rust-fixtures:
    deps: [~:mod-download]
    inputs:
      - "@group(sources)"
      - testdata/fixtures/*.yaml
    script: |-
      set -euo pipefail
      go run ./cmd/oasmith --openapi testdata/fixtures/public-client.yaml --mode client --lang rust --out testdata/rust-client/src/public
      go run ./cmd/oasmith --openapi testdata/fixtures/rust-models.yaml --mode types --lang rust --out testdata/rust-client/src/models
    outputs:
      - testdata/rust-client/src/public/mod.rs
      - testdata/rust-client/src/models/mod.rs
    options:
      cache: true
  test-rust:
    deps: [~:generate-rust-fixtures]
    inputs:
      - "@group(sources)"
      - testdata/fixtures/*.yaml
      - testdata/rust-client/Cargo.*
      - testdata/rust-client/src/lib.rs
    command: cargo test --locked --manifest-path testdata/rust-client/Cargo.toml
    options:
      cache: true
