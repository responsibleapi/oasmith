name: Release

# Push a `vX.Y.Z` tag to publish static binaries for every supported platform.
# Asset names follow `oasmith-<os>-<arch>[.exe]`, which mise's `github:` backend
# matches and installs as `oasmith`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
      - name: Test
        run: go test -count=1 -timeout=30s ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" \
              -o "dist/oasmith-${os}-${arch}${ext}" ./cmd/oasmith
          done
          (cd dist && sha256sum oasmith-* > checksums.txt)
          ./dist/oasmith-linux-amd64 --version
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/oasmith-*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
