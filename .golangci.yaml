version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: all
  enable:
    # Security and correctness checks kept on explicitly.
    - gosec
    - nilnil
    - noctx
    - wrapcheck
  disable:
    # Linters for dependencies OASmith does not use.
    - arangolint
    - clickhouselint
    - ginkgolinter
    - loggercheck
    - protogetter
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - unqueryvet
    - zerologlint
    # Checks not adopted for the current code shape.
    - cyclop
    - err113
    - exhaustive
    # Subjective or project-policy checks not adopted by OASmith.
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funlen
    - gochecknoglobals
    - goconst
    - goheader
    - goprintffuncname
    - lll
    - mnd
    - nestif
    - nlreturn
    - noinlineerr
    - perfsprint
    - prealloc
    - tagliatelle
    - testifylint
    - testpackage
    - varnamelen
    # YAML unmarshalling intentionally uses mixed receiver types.
    - recvcheck
    - wsl
    - wsl_v5
    # Dependency-policy aliases remain disabled; gomodguard is deprecated.
    - gomodguard
    - gomodguard_v2
  exclusions:
    warn-unused: true
    rules:
      # Generated source and temporary files intentionally use these modes.
      - path: ^internal/goemit/goemit\.go$
        linters: [gosec]
        text: G301|G306
      - path: ^internal/tsemit/tsemit\.go$
        linters: [gosec]
        text: G301|G306
      # The formatter subprocess and temporary paths are internally constructed.
      - path: ^internal/tsemit/tsemit\.go$
        linters: [gosec]
        text: G(204|304|703)
      # CLI input paths are intentionally supplied by the caller.
      - path: ^internal/openapi/openapi\.go$
        linters: [gosec]
        text: G304
      # The integration tests create files and launch their checked tools.
      - path: ^oasmith_test\.go$
        linters: [gosec]
        text: G(204|304|306)
      - path: ^oasmith_test\.go$
        linters: [noctx]
        text: os/exec\.Command must not be called
      - path: ^internal/tsemit/tsemit\.go$
        linters: [noctx]
        text: os/exec\.Command must not be called
      # Internal error boundaries and test helpers intentionally preserve errors.
      - path: ^internal/cli/cli\.go$
        linters: [wrapcheck]
        text: error returned from external package is unwrapped
      - path: ^internal/goemit/goemit\.go$
        linters: [wrapcheck]
        text: error returned from external package is unwrapped
      - path: ^oasmith_test\.go$
        linters: [wrapcheck]
        text: error returned from external package is unwrapped
  settings:
    staticcheck:
      checks:
        - all
        # Generated/public API comments are not normalized yet.
        - -ST1020
        - -ST1021
    gomoddirectives:
      replace-allow-list:
        - github.com/getkin/kin-openapi

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: strict
    warn-unused: true
