openapi: 3.2.0
info: {title: Rust type names, version: "1"}
paths: {}
components:
  schemas:
    String: {type: string}
    Record:
      type: object
      required: [type, nullable, self]
      properties:
        type: {type: string}
        self: {type: string}
        nullable: {type: [string, "null"]}
        optional: {type: string}
    Connection:
      oneOf:
        - $ref: '#/components/schemas/Unconnected'
        - $ref: '#/components/schemas/Playlist'
      discriminator:
        propertyName: kind
        mapping:
          none: '#/components/schemas/Unconnected'
          import: '#/components/schemas/Playlist'
    Unconnected:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, const: none}
    Playlist:
      type: object
      additionalProperties: false
      required: [kind, source_url]
      properties:
        kind: {type: string, const: import}
        source_url: {type: string}
    Event:
      oneOf:
        - $ref: '#/components/schemas/Connection'
      discriminator:
        propertyName: type
        mapping:
          connection: '#/components/schemas/Connection'
    ImplicitEvent:
      oneOf:
        - $ref: '#/components/schemas/ImplicitPayload'
      discriminator: {propertyName: type}
    ImplicitPayload:
      type: object
      required: [type, value]
      properties:
        type: {type: string}
        value: {type: string}
