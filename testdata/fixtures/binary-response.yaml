openapi: 3.2.0
info:
  title: Binary response fixture
  version: "1"
paths:
  /files/{key}:
    get:
      operationId: getFile
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "404":
          description: No file with that key.
