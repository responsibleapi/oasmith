openapi: 3.2.0
info:
  title: Rust status response fixture
  version: "1"
paths:
  /catalog:
    get:
      operationId: listPodcasts
      responses:
        "200":
          description: Podcasts known to an older client
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Podcast'
  /payload:
    get:
      operationId: getPayload
      responses:
        "200":
          description: JSON text
          content:
            application/json:
              schema:
                type: string
        "202":
          description: JSON number
          content:
            application/json:
              schema:
                type: integer
        "206":
          description: Raw media
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  schemas:
    Podcast:
      type: object
      additionalProperties: false
      required: [id, title, youtube]
      properties:
        id: {type: string}
        title: {type: string}
        youtube:
          $ref: '#/components/schemas/YouTube'
    YouTube:
      oneOf:
        - $ref: '#/components/schemas/LinkedYouTube'
      discriminator:
        propertyName: status
        mapping:
          linked: '#/components/schemas/LinkedYouTube'
    LinkedYouTube:
      type: object
      additionalProperties: false
      required: [status, source]
      properties:
        status: {type: string, const: linked}
        source:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string}
