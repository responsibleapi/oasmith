openapi: 3.2.0
info: 
  title: Listenbox Private API
  version: "1"
paths: 
  /session: 
    get: 
      operationId: whoami
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/User"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  /session/app-shell: 
    get: 
      deprecated: true
      operationId: appShell
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/AppShellData"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  /session/default-team: 
    get: 
      operationId: defaultTeam
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Team"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: User has no team.
  "/session/pages/shows/{team_id}": 
    get: 
      operationId: showsPage
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/ShowsPage"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Team not found for user.
  "/session/pages/show/{show_id}": 
    get: 
      operationId: showPage
      parameters: 
        - name: show_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/ShowID"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/ShowPage"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Show not found for user.
  /session/teams: 
    post: 
      operationId: createTeam
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateTeam"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Team"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  "/session/teams/{team_id}/image-uploads/presign": 
    post: 
      operationId: createImageUploadPresign
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateImageUploadPresign"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CreatedImageUploadPresign"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Team not found for user.
  "/session/teams/{team_id}/media-uploads/presign": 
    post: 
      operationId: createMediaUploadPresign
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateMediaUploadPresign"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CreatedMediaUploadPresign"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Team not found for user.
  "/session/teams/{team_id}/media-uploads/multipart": 
    post: 
      operationId: createMediaMultipartUpload
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateMediaMultipartUpload"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CreatedMediaMultipartUpload"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Team not found for user.
  "/session/teams/{team_id}/media-uploads/{upload_session_id}/parts/presign": 
    post: 
      operationId: presignMediaUploadParts
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: upload_session_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/UploadSessionID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/PresignMediaUploadParts"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/PresignedMediaUploadParts"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Upload session not found.
  "/session/teams/{team_id}/media-uploads/{upload_session_id}/complete": 
    post: 
      operationId: completeMediaMultipartUpload
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: upload_session_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/UploadSessionID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CompleteMediaMultipartUpload"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CompletedMediaMultipartUpload"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "404": 
          description: Upload session not found.
  /session/api-keys: 
    get: 
      operationId: listAPIKeys
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#/components/schemas/ListedAPIKey"
                minItems: 0
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
    post: 
      operationId: createAPIKey
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateAPIKey"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CreatedAPIKey"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  "/session/teams/{team_id}/shows": 
    get: 
      operationId: listShows
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#/components/schemas/Show"
                minItems: 0
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
    post: 
      operationId: createShow
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateShow"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Show"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "403": 
          description: Missing show:create permission.
        "409": 
          description: Show slug already exists.
  "/session/teams/{team_id}/shows/{show_id}": 
    put: 
      operationId: updateShow
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: show_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/ShowID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/UpdateShow"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Show"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  "/session/teams/{team_id}/shows/{show_id}/episodes": 
    get: 
      operationId: listEpisodes
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: show_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/ShowID"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#/components/schemas/Episode"
                minItems: 0
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
    post: 
      operationId: createEpisode
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: show_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/ShowID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateEpisode"
      security: 
        - SessionAuth: 
            []
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Episode"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  "/session/teams/{team_id}/shows/{show_id}/episodes/{episode_id}": 
    put: 
      operationId: updateEpisode
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: show_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/ShowID"
        - name: episode_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/EpisodeID"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/UpdateEpisode"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Episode"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
  "/session/teams/{team_id}/shows/{show_id}/episodes/{episode_id}/episode-events": 
    get: 
      operationId: episodeProcessingEvents
      parameters: 
        - name: team_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/TeamID"
        - name: show_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/ShowID"
        - name: episode_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/EpisodeID"
      security: 
        - SessionAuth: 
            []
      responses: 
        "200": 
          description: Server-sent episode processing terminal events. Each SSE data line is an EpisodeProcessingCompleteEvent JSON object.
          content: 
            text/event-stream: 
              itemSchema: 
                $ref: "#/components/schemas/EpisodeProcessingCompleteEvent"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          $ref: "#/components/responses/RespInvalidSess"
        "403": 
          description: Missing episode access.
        "404": 
          description: Episode not found.
  "/{feed_id}.rss": 
    get: 
      operationId: renderShowRSSFeed
      parameters: 
        - name: feed_id
          in: path
          required: true
          schema: 
            $ref: "#/components/schemas/FeedID"
      responses: 
        "200": 
          description: "200"
          content: 
            application/rss+xml: 
              schema: 
                type: string
                description: Podcast RSS XML.
        "400": 
          $ref: "#/components/responses/RespValidationErr"
  /auth/google/signup: 
    post: 
      operationId: createGoogleSignupSession
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/GoogleSignup"
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Session"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
  /auth/signup: 
    post: 
      operationId: createPasswordSignupSession
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/PasswordAuth"
      responses: 
        "202": 
          description: Verification email accepted.
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "409": 
          description: Email already exists.
  /auth/login: 
    post: 
      operationId: createPasswordLoginSession
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/PasswordAuth"
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Session"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          description: Invalid email or password.
        "403": 
          description: Email is not verified.
  /auth/password/reset/request: 
    post: 
      operationId: requestPasswordReset
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/PasswordResetRequest"
      responses: 
        "202": 
          description: Password reset email accepted.
        "400": 
          $ref: "#/components/responses/RespValidationErr"
  /auth/password/reset/confirm: 
    post: 
      operationId: confirmPasswordReset
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/PasswordResetConfirmation"
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Session"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          description: Invalid or expired reset token.
  /auth/email/verify: 
    post: 
      operationId: verifyEmail
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/EmailVerification"
      responses: 
        "201": 
          description: "201"
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Session"
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "401": 
          description: Invalid or expired verification token.
  /test/emails: 
    get: 
      operationId: listTestEmails
      responses: 
        "200": 
          description: "200"
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#/components/schemas/TestEmail"
                minItems: 0
        "400": 
          $ref: "#/components/responses/RespValidationErr"
        "404": 
          description: Test mailer is not enabled.
components: 
  securitySchemes: 
    SessionAuth: 
      type: http
      description: Listenbox session token.
      scheme: bearer
  responses: 
    RespValidationErr: 
      description: "400"
      content: 
        application/octet-stream: 
          schema: 
            $ref: "#/components/schemas/ValidationErr"
    RespInvalidSess: 
      description: Invalid or expired session.
  schemas: 
    UserID: 
      type: string
      pattern: ^usr_
    NonEmptyString: 
      type: string
      minLength: 1
    User: 
      type: object
      properties: 
        id: 
          $ref: "#/components/schemas/UserID"
        email: 
          type: string
          format: email
        name: 
          $ref: "#/components/schemas/NonEmptyString"
        picture_url: 
          type: string
          format: uri
      required: 
        - id
        - email
    ValidationLocation: 
      type: string
      enum: 
        - body
        - query
        - path
        - header
        - cookie
    string: 
      type: string
    ValidationIssueCode: 
      type: string
      description: "Stable machine-readable validation failure code. Uses invalid, parse, required, JSON Schema keyword names, additionalProperties for unknown object fields, and format.<format> for named format failures."
      examples: 
        - required
        - minLength
        - format.uri
        - additionalProperties
    ValidationIssue: 
      type: object
      properties: 
        in: 
          $ref: "#/components/schemas/ValidationLocation"
        field: 
          type: string
        path: 
          type: array
          items: 
            $ref: "#/components/schemas/string"
        code: 
          $ref: "#/components/schemas/ValidationIssueCode"
        message: 
          $ref: "#/components/schemas/NonEmptyString"
      required: 
        - in
        - code
        - message
    ValidationErr: 
      type: object
      properties: 
        message: 
          $ref: "#/components/schemas/NonEmptyString"
        errors: 
          type: array
          items: 
            $ref: "#/components/schemas/ValidationIssue"
          minItems: 0
      required: 
        - message
        - errors
    TeamID: 
      type: string
      pattern: ^team_
    TeamRole: 
      type: string
      enum: 
        - owner
        - write
        - read
    Team: 
      type: object
      properties: 
        id: 
          $ref: "#/components/schemas/TeamID"
        name: 
          $ref: "#/components/schemas/NonEmptyString"
        role: 
          $ref: "#/components/schemas/TeamRole"
      required: 
        - id
        - name
        - role
    AppShellData: 
      type: object
      properties: 
        user: 
          $ref: "#/components/schemas/User"
        teams: 
          type: array
          items: 
            $ref: "#/components/schemas/Team"
          minItems: 1
      required: 
        - user
        - teams
    ShowID: 
      type: string
      pattern: ^shw_
    ShowSourceKind: 
      type: string
      enum: 
        - audio
        - video
      description: Required primary source workflow for the show. Video means the show has a video feed and can publish video delivery assets.
      examples: 
        - audio
        - video
    Show: 
      type: object
      properties: 
        id: 
          $ref: "#/components/schemas/ShowID"
        team_id: 
          $ref: "#/components/schemas/TeamID"
        title: 
          $ref: "#/components/schemas/NonEmptyString"
        slug: 
          $ref: "#/components/schemas/NonEmptyString"
        source_kind: 
          $ref: "#/components/schemas/ShowSourceKind"
        image_url: 
          type: string
          format: uri
        description: 
          type: string
        website_url: 
          type: string
          format: uri
      required: 
        - id
        - team_id
        - title
        - slug
        - source_kind
    ShowsPage: 
      type: object
      properties: 
        shell: 
          $ref: "#/components/schemas/AppShellData"
        team_id: 
          $ref: "#/components/schemas/TeamID"
        shows: 
          type: array
          items: 
            $ref: "#/components/schemas/Show"
          minItems: 0
      required: 
        - shell
        - team_id
        - shows
    EpisodeID: 
      type: string
      pattern: ^ep_
    EpisodeStatus: 
      type: string
      enum: 
        - draft
        - published
    UnixMillis: 
      description: UNIX epoch milliseconds.
      minimum: 0
      type: integer
      format: int64
    EpisodeProcessingStatus: 
      type: string
      enum: 
        - queued
        - processing
        - completed
        - failed
    EpisodeProcessingSnapshot: 
      type: object
      properties: 
        run_id: 
          $ref: "#/components/schemas/NonEmptyString"
        status: 
          $ref: "#/components/schemas/EpisodeProcessingStatus"
        current_step: 
          $ref: "#/components/schemas/NonEmptyString"
        percent: 
          minimum: 0
          maximum: 100
          type: integer
          format: uint32
        error_code: 
          $ref: "#/components/schemas/NonEmptyString"
        error_message: 
          $ref: "#/components/schemas/NonEmptyString"
      required: 
        - run_id
        - status
        - current_step
        - percent
    FeedID: 
      type: string
      pattern: ^lb_
    EpisodeEnclosureFormat: 
      type: string
      enum: 
        - mp3
        - m4a
        - mp4
    EpisodeEnclosure: 
      type: object
      properties: 
        feed_id: 
          $ref: "#/components/schemas/FeedID"
        url: 
          type: string
          format: uri
        content_type: 
          $ref: "#/components/schemas/NonEmptyString"
        byte_length: 
          minimum: 1
          type: integer
          format: int64
        format: 
          $ref: "#/components/schemas/EpisodeEnclosureFormat"
        duration_seconds: 
          minimum: 1
          type: integer
          format: int64
      required: 
        - feed_id
        - url
        - content_type
        - byte_length
        - format
        - duration_seconds
    Episode: 
      type: object
      properties: 
        id: 
          $ref: "#/components/schemas/EpisodeID"
        show_id: 
          $ref: "#/components/schemas/ShowID"
        title: 
          $ref: "#/components/schemas/NonEmptyString"
        slug: 
          $ref: "#/components/schemas/NonEmptyString"
        status: 
          $ref: "#/components/schemas/EpisodeStatus"
        description: 
          type: string
        republished_at: 
          $ref: "#/components/schemas/UnixMillis"
        thumbnail_url: 
          type: string
          format: uri
        processing: 
          $ref: "#/components/schemas/EpisodeProcessingSnapshot"
        enclosures: 
          type: array
          items: 
            $ref: "#/components/schemas/EpisodeEnclosure"
          minItems: 0
      required: 
        - id
        - show_id
        - title
        - slug
        - status
        - enclosures
    ShowPage: 
      type: object
      properties: 
        shell: 
          $ref: "#/components/schemas/AppShellData"
        show: 
          $ref: "#/components/schemas/Show"
        episodes: 
          type: array
          items: 
            $ref: "#/components/schemas/Episode"
          minItems: 0
      required: 
        - shell
